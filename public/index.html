<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>

#app{max-width:520px;margin:0 auto;min-height:100%;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

.tag{text-align:center;color:var(--dim);font-size:15px;margin-top:-6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}

button:disabled{opacity:.35;pointer-events:none}
button.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button.pink{background:var(--pink);color:#fff}
button.grn{background:var(--grn)}
button.big{padding:18px;font-size:20px}
.code{font-size:46px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--yel);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.small{font-size:13px}.center{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip.off{opacity:.4}
.crown{font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.timer{height:10px;background:#0e1130;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--grn),var(--yel),var(--pink));transform-origin:left;}
.hero{text-align:center;padding:10px 0}
.hero .em{font-size:64px;line-height:1}
.hero h2{font-size:30px;margin-top:6px}
.hero p{color:var(--dim);margin:6px 0 0;font-size:16px;line-height:1.4}





.q{font-size:21px;font-weight:800;line-height:1.45;text-align:center;padding:6px 2px;word-break:keep-all}
.q small{display:block;font-size:13px;color:var(--cyan);font-weight:700;margin-bottom:4px}
.fog{filter:blur(9px);transition:filter 1s}
.fog.clear{filter:none}
.mirror{transform:scaleX(-1)}
.fxbar{background:#3a1220;border:1px solid var(--pink);color:#ffc2cf;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;text-align:center}
.opts{display:grid;gap:10px}
.opt{background:var(--panel2);color:var(--txt);border:2px solid var(--line);text-align:left;padding:16px;font-size:18px}
.opt.sel{border-color:var(--cyan);background:#10304a}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seq span{min-width:52px;padding:12px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.seq span.qm{background:var(--yel);color:#10122a}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums button{font-size:30px;padding:16px 0;background:var(--cyan)}
.nums button.used{opacity:.25}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ops button{padding:12px 0;font-size:24px;background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.expr{min-height:58px;background:#0e1130;border:2px dashed var(--line);border-radius:14px;padding:12px;font-size:26px;font-weight:800;text-align:center;letter-spacing:2px;word-break:break-all}

.slider{width:100%;accent-color:var(--yel);height:40px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.sab{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.clues{gap:6px}

.dgrid{display:grid;gap:5px;max-width:360px;margin:0 auto;width:100%}
.dgrid span,.pyr span{display:flex;align-items:center;justify-content:center;min-height:46px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:900;font-size:21px;font-variant-numeric:tabular-nums}

.pyr div{display:flex;gap:5px}
.pyr span{width:56px;min-height:42px;font-size:18px}
/* 결합 */
.hapg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto;width:100%}
.hapt{position:relative;padding:4px;background:var(--panel2);border:3px solid var(--line);border-radius:14px}

/* 스도쿠 */

.sdk button.bad{color:var(--pink)}

.icards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* ── 한 기기 모드 ── */
.xbtn{background:var(--panel2);color:var(--dim);border:1px solid var(--line);padding:6px 11px;font-size:14px;border-radius:999px}

.pass{text-align:center;padding:7vh 10px 4vh;display:flex;flex-direction:column;gap:6px;align-items:center}

.big1{font-size:60px;line-height:1.1}

/* 파티 화면 */
.pty{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 32px)}

.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{aspect-ratio:1;border-radius:50%;background:#f4f4f8;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:14%}

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
// 사칙연산 수식 파서 (서버·브라우저 공용). 분수 연산이라 부동소수점 오차가 없다.
(function (root) {
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function frac(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }

  // 문자열을 평가해 { value:{n,d}, nums:[사용한 숫자들] } 반환. 문법 오류면 throw.
  function evaluate(src) {
    const s = String(src).replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/');
    if (!s || s.length > 80) throw new Error('empty');
    const tokens = s.match(/\d+|[+\-*\/()]/g);
    if (!tokens || tokens.join('') !== s) throw new Error('bad char');
    let pos = 0;
    const nums = [];
    function peek() { return tokens[pos]; }
    function factor() {
      const t = tokens[pos++];
      if (t === undefined) throw new Error('eof');
      if (t === '(') {
        const v = expr();
        if (tokens[pos++] !== ')') throw new Error('paren');
        return v;
      }
      if (/^\d+$/.test(t)) { nums.push(Number(t)); return frac(Number(t), 1); }
      throw new Error('unexpected ' + t);
    }
    function term() {
      let v = factor();
      while (peek() === '*' || peek() === '/') {
        const op = tokens[pos++];
        const r = factor();
        if (op === '*') v = frac(v.n * r.n, v.d * r.d);
        else { if (r.n === 0) throw new Error('div0'); v = frac(v.n * r.d, v.d * r.n); }
      }
      return v;
    }
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') {
        const op = tokens[pos++];
        const r = term();
        v = op === '+' ? frac(v.n * r.d + r.n * v.d, v.d * r.d) : frac(v.n * r.d - r.n * v.d, v.d * r.d);
      }
      return v;
    }
    const value = expr();
    if (pos !== tokens.length) throw new Error('trailing');

function solveTarget(nums, target) {
  let found = null, count = 0;
  (function rec(items) {
    if (items.length === 1) { const it = items[0]; if (it.d === 1 && it.n === target) { count++; if (!found) found = it.e; } return; }
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j], rest = items.filter((_, k) => k !== i && k !== j);
      const c = [
        { n: a.n * b.d + b.n * a.d, d: a.d * b.d, e: `(${a.e}+${b.e})` },
        { n: a.n * b.d - b.n * a.d, d: a.d * b.d, e: `(${a.e}-${b.e})` },
        { n: b.n * a.d - a.n * b.d, d: a.d * b.d, e: `(${b.e}-${a.e})` },
        { n: a.n * b.n, d: a.d * b.d, e: `(${a.e}*${b.e})` },
      ];
      if (b.n !== 0) c.push({ n: a.n * b.d, d: a.d * b.n, e: `(${a.e}/${b.e})` });
      if (a.n !== 0) c.push({ n: b.n * a.d, d: b.d * a.n, e: `(${b.e}/${a.e})` });
      for (const x of c) { if (x.d < 0) { x.n = -x.n; x.d = -x.d; } rec([...rest, x]); }
    }
  })(nums.map((x) => ({ n: x, d: 1, e: String(x) })));
  return { expr: found && found.replace(/^\((.*)\)$/, '$1'), count };
}

    default: return String(v).slice(0, 14);
  }
}

// 각자 몰래 고른 뒤 한꺼번에 공개하는 심리전 결과. players: [{id,n,c}], answers: {id: 정규화된 답 | null}
function resolveSocial(t, Q, players, answers) {
  const pub = Q.pub, sec = Q.secret;
  const P = players.map((p) => ({ id: p.id, n: p.n, c: p.c, answer: answers[p.id] === undefined ? null : answers[p.id], gave: false }));
  const ans = P.filter((p) => p.answer !== null);
  const rows = [];
  let answerText = Q.answerText || '', expl = Q.expl || '';
  const miss = () => '시간 초과';
  const row = (p, ok, d, note) => rows.push({ id: p.id, n: p.n, c: p.c, sh: shownOf(t, p.answer, pub), ok: !!ok, d, note: note || '' });
  if (t === 'beauty') {
    const [mn, md] = pub.mul || [2, 3];
    const avg = ans.length ? ans.reduce((a, p) => a + p.answer, 0) / ans.length : 0, target = avg * mn / md;
    const bd = Math.min(...ans.map((p) => Math.abs(p.answer - target)));
    const W = ans.filter((p) => Math.abs(p.answer - target) === bd);
    for (const p of P) { const win = W.includes(p); row(p, win, win ? Math.round(110 / (W.length > 1 ? 1.5 : 1)) : 0, p.answer === null ? miss(p) : win ? '🏆 승리' : `거리 ${Math.abs(p.answer - target).toFixed(1)}`); }
    answerText = ans.length ? `평균 ${avg.toFixed(1)} × ${mn}/${md} = ${target.toFixed(1)}` : '제출 없음';
    expl = '남의 생각을 읽으려 할수록 숫자는 0으로 미끄러진다.';
  } else if (t === 'minority') {
    const c = [0, 0]; ans.forEach((p) => c[p.answer]++);
    const ws = c[0] !== c[1] && c[0] && c[1] ? (c[0] < c[1] ? 0 : 1) : -1;
    const nm = [pub.A || 'A', pub.B || 'B'];
    for (const p of P) {
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (ws < 0) row(p, false, 0, '무승부');
      else if (p.answer === ws) row(p, true, 100, '🏆 소수파');
      else row(p, false, 0, '다수파');
    }
    answerText = `${nm[0]} ${c[0]}명 : ${nm[1]} ${c[1]}명${ws < 0 ? ' (무승부)' : ` → ${nm[ws]} 승`}`;
  } else if (t === 'lowest') {
    const cnt = {}; ans.forEach((p) => { cnt[p.answer] = (cnt[p.answer] || 0) + 1; });
    const uniq = Object.keys(cnt).filter((k) => cnt[k] === 1).map(Number).sort((a, b) => a - b);
    const win = uniq.length ? uniq[0] : null;
    for (const p of P) {
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (p.answer === win) row(p, true, 120, '🏆 유일한 최저수');
      else row(p, false, 0, cnt[p.answer] > 1 ? `${cnt[p.answer]}명 겹침` : '더 작은 유일수 있음');
    }
    answerText = win === null ? '유일한 수가 없음 — 전원 실패' : `유일한 최저수: ${win}`;
    expl = Object.keys(cnt).sort((a, b) => a - b).map((k) => `${k}(${cnt[k]}명)`).join(' ');
  } else if (t === 'split') {
    const co = ans.filter((p) => p.answer === 0).length, be = ans.length - co;
    const C = pub.coop || 60, POT = pub.pot || 130, L = pub.lose || 30;
    for (const p of P) {
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (be === 0) row(p, true, C, '🤝 전원 협력');
      else if (co === 0) row(p, false, -L, '💥 공멸');
      else if (p.answer === 1) row(p, true, Math.round(POT / be), '🗡️ 배신 성공');
      else row(p, false, -L, '😱 배신당함');
    }
    answerText = `🤝 협력 ${co}명 · 🗡️ 배신 ${be}명`;
    expl = be === 0 ? '모두가 믿었다.' : co === 0 ? '아무도 믿지 않았다.' : '배신자들이 보상을 나눠 가졌다.';
  } else if (t === 'indian') {
    const card = (p) => pub.cards[p.id] || 0;
    const go = ans.filter((p) => p.answer === 0), fold = ans.filter((p) => p.answer === 1);
    const top = go.length ? Math.max(...go.map(card)) : 0, maxAll = Math.max(0, ...P.map(card));
    const W = go.filter((p) => card(p) === top), L = go.filter((p) => card(p) !== top);
    const pot = 30 * L.length + 10 * fold.length;
    for (const p of P) {
      const c = card(p);
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (p.answer === 1) { const pen = c === maxAll ? 30 : 10; row(p, false, -pen, `내 카드 ${c} · 포기${pen > 10 ? ' (최고 카드를 버림!)' : ''}`); }
      else if (W.includes(p)) row(p, true, 30 + Math.round(pot / W.length), `내 카드 ${c} · 🏆 승부 승리`);
      else row(p, false, -30, `내 카드 ${c} · 승부 패배`);
    }
    answerText = P.map((p) => `${p.n} ${card(p)}`).join(' · ');
    expl = '승부 승자: +30 + (패자 1명당 30, 포기자 1명당 10). 패자 −30, 포기 −10 (최고 카드를 버리면 −30)';
  } else if (t === 'goods') {
    const C = pub.C, m = pub.m, N = Math.max(1, ans.length), tot = ans.reduce((a, p) => a + p.answer, 0), share = (tot * m) / N;
    for (const p of P) {
      if (p.answer === null) { row(p, false, 0, miss(p)); continue; }
      const pay = C - p.answer + share, d = Math.round(((pay - C) * 100) / C);
      row(p, d > 0, d, `냄 ${p.answer} · 받음 ${share.toFixed(1)}`);
    }
    answerText = `금고 ${tot}코인 × ${m} = ${(tot * m).toFixed(1)} → 1인당 ${share.toFixed(1)}`;
    expl = '모두 다 내면 모두가 이득, 혼자만 안 내면 더 이득. 그래서 다들 안 내면 아무도 이득이 없다.';
  } else if (t === 'auction') {
    const val = sec.vals.reduce((a, b) => a + b, 0);
    const bids = ans.map((p) => p.answer), top = bids.length ? Math.max(...bids) : -1, tops = ans.filter((p) => p.answer === top);
    const win = tops.length === 1 && top > 0 ? tops[0] : null;
    for (const p of P) {
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (p === win) row(p, val - top > 0, val - top, `🔨 낙찰! 가치 ${val} − 입찰 ${top}`);
      else row(p, false, 0, tops.length > 1 && p.answer === top ? '최고가 동점 → 유찰' : `입찰 ${p.answer}`);
    }
    answerText = `상품 가치 ${val} (${sec.vals.join('+')})`;
    expl = win ? (val - top >= 0 ? '싸게 샀다!' : '승자의 저주 — 너무 비싸게 샀다.') : '낙찰자 없음';
  } else if (t === 'rps') {
    const c = [0, 0, 0]; ans.forEach((p) => c[p.answer]++);
    const kinds = c.filter((x) => x).length;
    let winK = -1; if (kinds === 2) { if (!c[0]) winK = 1; else if (!c[1]) winK = 2; else winK = 0; } // 바위0 가위1 보2: 바위>가위, 가위>보, 보>바위
    const winners = winK < 0 ? 0 : c[winK], losers = ans.length - winners;
    for (const p of P) {
      if (p.answer === null) row(p, false, 0, miss(p));
      else if (winK < 0) row(p, false, 0, '무승부');
      else if (p.answer === winK) row(p, true, 30 + Math.round(90 * losers / Math.max(1, ans.length - 1)), '🏆 승리');
      else row(p, false, -20, '패배');
    }
    answerText = `✊ ${c[0]} · ✌️ ${c[1]} · 🖐️ ${c[2]}` + (winK < 0 ? ' → 무승부' : ` → ${['✊', '✌️', '🖐️'][winK]} 승`);
    expl = '이긴 사람이 적을수록, 진 사람이 많을수록 점수가 크다.';
  } else if (t === 'telepathy') {
    const cnt = pub.options.map(() => 0); ans.forEach((p) => cnt[p.answer]++);
    for (const p of P) {
      if (p.answer === null) { row(p, false, 0, miss(p)); continue; }
      const same = cnt[p.answer] - 1;
      row(p, same > 0, same * 25, same ? `나와 같은 사람 ${same}명` : '아무도 안 골랐다');
    }
    answerText = pub.options.map((o, i) => `${o} ${cnt[i]}`).join(' · ');
    expl = pub.text;
  }
  return { rows, at: answerText, ex: expl };
}

/* ═════════════ 차례 게임: 각자 자기 문제 ═════════════ */
function runTurns() {
  const list = order(); const results = [];
  const step = (k) => {
    if (k >= list.length) return finishTurns(results);
    const p = list[k];
    passView(p, list.length > 1 ? '다른 사람은 화면을 보지 마세요 · 문제는 사람마다 달라요' : '준비되면 누르세요', () => playTurn(p, (r) => { results.push(r); step(k + 1); }));
  };
  step(0);
}
function playTurn(p, onDone) {
  const t = G.type, Q = makeQ(t, { used: G.used, hard: hard(), ids: G.players.map((x) => x.id) });
  const fx = p.fx.filter((f) => !(f === 'shrink' && !timed())); p.fx = [];
  const base = TYPES[t].limit * 1000, lim = timed() ? (fx.includes('shrink') ? Math.round(base * 0.65) : base) : 0;
  const FXN = { fog: '🌫️ 안개 — 문제가 흐릿하게 시작돼요', mirror: '🪞 거울 — 문제가 뒤집혔어요', shrink: '⏳ 시간 단축 — 제한시간 35% 감소' };
  shim(p.id);
  $app.innerHTML = `
    <div class="topbar">${roundBadge()}<span class="badge" style="border-color:${p.c};color:${p.c}">${esc(p.n)}</span></div>
    <div class="timer ${lim ? '' : 'free'}"><i id="tbar"></i></div>
    ${fx.length ? `<div class="fxbar">${fx.map((f) => FXN[f]).join('<br>')}</div>` : ''}
    <div class="row"><span class="grow"></span><span class="badge" id="tsec"></span></div>
    <div id="stage" class="col"></div>
    ${lim ? '' : '<button class="sec" id="giveup">🏳️ 포기</button>'}`;
  locked = false; playT0 = performance.now(); tTotal = lim || 1; tEnd = lim ? playT0 + lim : Infinity;
  const finish = (raw, gave) => {
    if (locked && turnActive === null) return;
    locked = true; turnActive = null;
    const el = performance.now() - playT0;
    const v = raw === null ? null : normalize(t, raw, Q.pub);
    const r = scoreTurn(t, Q, v, el, lim, gave);
    r.p = p; r.el = el;
    feedbackView(p, Q, r, () => onDone(r));
  };
  turnActive = { timeout: () => finish(null, false) };
  curSubmit = (v) => finish(v, false);
  const gu = document.getElementById('giveup'); if (gu) gu.onclick = () => { if (confirm('이 문제를 포기할까요? (0점)')) finish(null, true); };
  renderTurn(document.getElementById('stage'), t, Q.pub, fx);
}
function turnSubmit(v) { if (curSubmit) curSubmit(v); }

// 한 사람의 답을 채점. { ok, d, note, sh, at, ex }
function scoreTurn(t, Q, v, el, lim, gave) {
  const sec = Q.secret, pub = Q.pub, free = !lim;
  const sp = free || v === null ? 0 : Math.max(0, 1 - el / lim);
  let at = Q.answerText || '', ex = Q.expl || '', ok = false, d = 0, note = '';
  const BIN = {
    calc24: (x) => Expr.check(x, sec.nums, sec.target).ok,
    trivia: (x) => x === sec.ans, liar: (x) => x === sec.ans, sequence: (x) => x === sec.ans,
    memory: (x) => x.length === sec.cells.length && x.every((y, i) => y === sec.cells[i]),
    timeline: (x) => x.every((y, i) => y === sec.ans[i]),
    code: (x) => x === sec.ans, digits: (x) => x === sec.ans, chosung: (x) => x === sec.ans,
  };
  const judge = pub.ui ? (x) => judgeGeneric(x, sec, pub) : JUDGE2[t] ? (x) => JUDGE2[t](x, sec, pub) : BIN[t];
  if (t === 'calc24') at = sec.expr.replace(/\*/g, '×').replace(/\//g, '÷') + ' = ' + sec.target;
  if (v === null) return { ok: false, d: 0, note: gave ? '🏳️ 포기' : '⏰ 시간 초과', sh: gave ? '포기' : '—', at, ex, sp: 0 };
  if (t === 'mental' || t === 'stroop') {
    let c = 0; sec.ans.forEach((x, i) => { if (v[i] === x) c++; });
    const acc = c / sec.ans.length; ok = acc >= 0.75;
    d = ok ? Math.round(free ? 40 + 70 * acc : 30 + 60 * acc + 40 * sp) : 0;
    note = `${c}/${sec.ans.length} 정답`; if (t === 'mental') at = Q.expl, ex = '';
  } else if (t === 'fermi') {
    const e = Math.abs(Math.log(v / sec.value)), tol = free ? 0.18 : 0.25;
    ok = e <= tol; d = ok ? Math.round(40 + 80 * (1 - e / tol)) : 0;
    note = ok ? (e < 0.05 ? '🎯 거의 정확!' : '근접!') : `${Math.round((Math.exp(e) - 1) * 100)}% 빗나감`;
  } else {
    ok = !!judge(v);
    d = ok ? Math.round(free ? 100 : 50 + 70 * sp) : 0;
    note = ok ? '정답!' : '오답';
    if (t === 'schulte') note = `실수 ${v}번` + (ok ? '' : ' (4번부터 실격)');
  }
  return { ok, d, note, sh: shownOf(t, v, pub), at, ex, sp: ok ? sp : 0 };
}
function feedbackView(p, Q, r, next) {
  $app.innerHTML = `
    <div class="topbar">${roundBadge()}<span class="badge" style="border-color:${p.c};color:${p.c}">${esc(p.n)}</span></div>

      ${r.ok ? '' : `<div class="small dim">${r.sh && r.sh !== '—' ? `내 답: ${esc(r.sh)}` : ''}</div>`}</div>
    <div class="ans"><div class="dim small">정답</div><b>${esc(r.at)}</b>${r.ex ? `<div class="small dim" style="margin-top:6px;line-height:1.5">${esc(r.ex)}</div>` : ''}</div>
    <button class="big" id="nx">다음 ▶</button>`;
  document.getElementById('nx').onclick = next;
}
function finishTurns(results) {
  const oks = results.filter((r) => r.ok && r.sp > 0).sort((a, b) => a.el - b.el);
  const rows = results.map((r) => {
    let d = r.d, note = r.note;
    if (timed() && results.length > 1 && oks[0] === r) { d += 25; note += ' · ⚡ 최속 +25'; }
    if (r.ok && r.sp > 0) { r.p.stats.speedSum += r.sp; r.p.stats.speedN++; }
    return { id: r.p.id, ok: r.ok, d, note, sh: r.sh };
  });
  revealView({ rows, at: '', ex: '' });
}

/* ═════════════ 몰래 고르기 (심리전) ═════════════ */
function runSecret() {
  const t = G.type, Q = makeQ(t, { used: G.used, hard: hard(), ids: G.players.map((p) => p.id) });
  const list = order(), answers = {};
  const step = (k) => {
    if (k >= list.length) { const res = resolveSocial(t, Q, G.players, answers); return revealView(res); }
    const p = list[k];
    passView(p, '아무도 못 보게 고르세요', () => {
      shim(p.id);
      const lim = timed() ? TYPES[t].limit * 1000 : 0;
      $app.innerHTML = `
        <div class="topbar">${roundBadge()}<span class="badge" style="border-color:${p.c};color:${p.c}">${esc(p.n)}</span></div>
        <div class="timer ${lim ? '' : 'free'}"><i id="tbar"></i></div>
        <div class="row"><span class="grow"></span><span class="badge" id="tsec"></span></div>
        <div id="stage" class="col"></div>`;
      locked = false; playT0 = performance.now(); tTotal = lim || 1; tEnd = lim ? playT0 + lim : Infinity;
      const done = (v) => {
        if (locked) return; locked = true; turnActive = null;
        answers[p.id] = v === null ? null : normalize(t, v, Q.pub);
        $app.innerHTML = `<div class="pass pop"><div class="big1">🤐</div><b style="font-size:22px">${v === null ? '시간 초과!' : '제출 완료!'}</b><div class="dim">화면을 가리고 다음 사람에게 넘겨주세요</div></div><button class="big" id="nx">${k + 1 < list.length ? '다음 사람 ▶' : '결과 공개!'}</button>`;
        document.getElementById('nx').onclick = () => step(k + 1);
      };
      turnActive = { timeout: () => done(null) };
      curSubmit = done;
      UI2[t]({ stage: document.getElementById('stage'), q: Q.pub, cls: '', submit: (v) => done(v), qbox: (inner, small) => `<div class="q">${small ? `<small>${esc(small)}</small>` : ''}${inner}</div>`, numInput: (ph) => `<input id="in" type="text" inputmode="numeric" placeholder="${esc(ph)}" style="text-align:center;font-weight:800;font-size:22px" autocomplete="off"><button class="big" id="ok">제출</button>`, bindInput: (check) => { const go = () => { const r = check(document.getElementById('in').value.trim()); if (r !== undefined) done(r); }; document.getElementById('ok').onclick = go; document.getElementById('in').onkeydown = (e) => { if (e.key === 'Enter') go(); }; }, choice: () => {}, T: t });
    });
  };
  step(0);
}

/* ═════════════ 다같이 (파티) ═════════════ */
function runParty() {
  PARTY[G.type]({
    players: order(), hard: hard(), timed: timed(), limit: TYPES[G.type].limit * 1000,
    done: (deltas, at, ex, notes) => {
      // 한 라운드에서 잃는 점수는 최대 100점까지
      const rows = G.players.map((p) => { const d = Math.max(-100, deltas[p.id] || 0); return { id: p.id, ok: d > 0, d, note: ((notes && notes[p.id]) || '') + (d !== (deltas[p.id] || 0) ? ' (감점은 최대 −100)' : ''), sh: '' }; });
      revealView({ rows, at: at || '', ex: ex || '' });
    },
  });
}

/* ═════════════ 라운드 결과 + 방해 카드 ═════════════ */
function revealView(res) {
  PT.clear(); turnActive = null;
  const deltas = {};
  for (const r of res.rows) {
    const p = G.players.find((x) => x.id === r.id); if (!p) continue;
    p.s += r.d; deltas[p.id] = r.d;
    if (r.ok) p.stats.correct++;
    p.stats.best = Math.max(p.stats.best, r.d);
  }
  const rows = res.rows.slice().sort((a, b) => b.d - a.d);
  const multi = G.players.length > 1, top = rows[0];
  const winner = multi && top && top.d > 0 && (!rows[1] || rows[1].d < top.d) ? G.players.find((p) => p.id === top.id) : null;
  const last = G.idx + 1 >= G.plan.length;
  $app.innerHTML = `
    <div class="topbar"><span class="badge">R${G.idx + 1} 결과 · ${TYPES[G.type].emoji} ${esc(TYPES[G.type].label)}</span><button class="xbtn" id="qt">✕</button></div>

    <div id="card"></div>

function sabotagePanel(w) {
  const box = document.getElementById('card'); let kind = null, target = null;
  const kinds = Object.entries(SABOTAGE).filter(([, v]) => !(G.mode === 'free' && v.timeOnly));
  const draw = () => {

/* ═════════════ 파티 게임: 기기 하나를 다같이 둘러싸고 ═════════════
   PARTY[type](ctx)  ctx = { players, hard, timed, limit, done(deltas, 결과문구, 설명, 개인메모) } */
const PT = { ids: [], clear() { this.ids.forEach((t) => { clearTimeout(t); clearInterval(t); }); this.ids = []; } };
const later = (f, ms) => { const t = setTimeout(f, ms); PT.ids.push(t); return t; };
const every = (f, ms) => { const t = setInterval(f, ms); PT.ids.push(t); return t; };
const zeroD = (ctx) => { const D = {}; ctx.players.forEach((p) => { D[p.id] = 0; }); return D; };
const byId = (ctx, id) => ctx.players.find((p) => p.id === id);

// 버저 화면: 4명 이상이면 절반은 화면 위쪽(뒤집힌 버튼)에 앉은 사람 몫
function buzzScreen(ctx, onBuzz) {
  const ps = ctx.players, half = ps.length >= 4 ? Math.floor(ps.length / 2) : 0;
  const top = ps.slice(0, half), bot = ps.slice(half);
  const btn = (p) => `<button class="buzz" data-p="${p.id}" style="--c:${p.c}"><b>${esc(p.n)}</b><small id="bs_${p.id}">0</small></button>`;
  $app.innerHTML = `<div class="pty">
    ${top.length ? `<div class="bz top">${top.map(btn).join('')}</div>` : ''}
    <div class="topbar">${roundBadge()}<span class="badge" id="pinfo"></span><button class="xbtn" id="qt">✕</button></div>
    <div class="timer"><i id="ptbar"></i></div>
    <div class="pmid col" id="pmid"></div>
    <div class="bz bot">${bot.map(btn).join('')}</div></div>`;
  document.getElementById('qt').onclick = quit;
  const on = new Set(ps.map((p) => p.id));
  $app.querySelectorAll('.buzz').forEach((b) => b.addEventListener('pointerdown', (e) => {
    e.preventDefault(); const id = b.dataset.p; if (!on.has(id)) return;
    b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); onBuzz(id, b);
  }));
  return {
    mid: document.getElementById('pmid'),
    enable(ids) { on.clear(); ids.forEach((i) => on.add(i)); $app.querySelectorAll('.buzz').forEach((b) => b.classList.toggle('off', !on.has(b.dataset.p))); },
    score(D) { for (const id in D) { const el = document.getElementById('bs_' + id); if (el) el.textContent = sgn(D[id]); } },
    info(t) { const el = document.getElementById('pinfo'); if (el) el.textContent = t; },
    flash(id, cls) { const b = $app.querySelector(`.buzz[data-p="${id}"]`); if (b) { b.classList.add(cls); later(() => b.classList.remove(cls), 600); } },
  };
}

/* ───────── 🃏 결! 합! (끝까지) ───────── */

/* ───────── 🔔 버저 퀴즈 ───────── */
function quizQ(hard, used) {
  const k = pick(['trivia', 'trivia', 'trivia', 'chosung', 'chosung', 'sequence', 'fruit', 'calc', 'clock']);
  if (k === 'trivia') { const q = makeTrivia(used); return { kind: 'mc', text: q.pub.text, sub: q.pub.cat, options: q.pub.options, ans: q.secret.ans, at: q.answerText, ex: q.expl }; }
  if (k === 'chosung') { const q = makeChosung(used, hard); return { kind: 'text', big: q.pub.cho, text: '초성 퀴즈', sub: hard ? '분류는 비밀' : `분류: ${q.pub.cat}`, ans: q.secret.ans, at: q.answerText }; }
  if (k === 'sequence') { const q = makeSequence(hard); return { kind: 'num', text: '다음에 올 수는?', big: q.pub.seq.join(', ') + ', ?', ans: q.secret.ans, at: String(q.secret.ans), ex: q.expl }; }
  if (k === 'fruit') { const q = genFruit(hard); return { kind: 'num', text: q.pub.text, lines: q.pub.lines, sub: '곱셈 먼저', ans: q.secret.ans, at: q.answerText, ex: q.expl }; }
  if (k === 'clock') { const q = genClock(hard); return { kind: 'num', text: q.pub.text, big: q.pub.big, sub: '단위: 도', ans: q.secret.ans, at: q.answerText }; }
  const a = between(hard ? 12 : 3, hard ? 49 : 12), b = between(hard ? 12 : 3, hard ? 39 : 12), c = between(5, hard ? 99 : 30), op = pick(['+', '−']);
  const ans = op === '+' ? a * b + c : a * b - c;
  return { kind: 'num', text: '계산!', big: `${a} × ${b} ${op} ${c}`, ans, at: String(ans) };
}

/* ───────── 🙈 눈치 게임 ───────── */
PARTY.nunchi = (ctx) => {
  const D = zeroD(ctx), w = ctx.hard ? pick([300, 400, 500]) : pick([400, 500, 600, 700]), lim = ctx.hard ? 12000 : 15000;
  const st = {}; // id → { num, t, res: 'safe'|'crash'|'early'|'last' }
  let phase = 'ready', lastId = null, lastT = 0, num = 0, endAt = 0;
  const B = buzzScreen(ctx, (id) => {
    if (st[id] || phase === 'end') return;
    if (phase === 'ready') { st[id] = { num: 0, res: 'early' }; B.flash(id, 'bad'); toast(`🚫 ${byId(ctx, id).n} 부정출발!`); refresh(); return; }
    const now = performance.now(); num++;
    st[id] = { num, t: now, res: 'safe' };
    if (lastId && now - lastT < w) { st[id].res = 'crash'; if (st[lastId].res === 'safe') st[lastId].res = 'crash'; B.flash(id, 'bad'); B.flash(lastId, 'bad'); }
    else B.flash(id, 'good');
    lastId = id; lastT = now; refresh();
  });
  const left = () => ctx.players.filter((p) => !st[p.id]);
  const refresh = () => {
    B.enable(phase === 'end' ? [] : left().map((p) => p.id));
    const list = ctx.players.filter((p) => st[p.id] && st[p.id].num).sort((a, b) => st[a.id].num - st[b.id].num);
    B.mid.innerHTML = `<div class="q"><small>동시에(${(w / 1000).toFixed(1)}초 안에) 누르면 둘 다 탈락 · 마지막까지 못 누르면 탈락</small>${phase === 'ready' ? '준비…' : phase === 'end' ? '끝!' : '1부터 한 명씩, 자기 버튼!'}</div>
      <div class="nlist">${list.map((p) => `<div class="nrow ${st[p.id].res}" style="--c:${p.c}"><b>${st[p.id].num}</b><span>${esc(p.n)}</span><em>${st[p.id].res === 'crash' ? '💥 동시!' : '✅'}</em></div>`).join('') || '<div class="dim center">아직 아무도 안 눌렀어요</div>'}</div>`;
    if (phase === 'go' && left().length <= 1) end();
  };
  const end = () => {
    if (phase === 'end') return; phase = 'end';
    for (const p of left()) st[p.id] = { num: 0, res: 'last' };
    const notes = {};
    for (const p of ctx.players) { const r = st[p.id].res; D[p.id] = r === 'safe' ? 30 : r === 'crash' ? -20 : -30; notes[p.id] = { safe: `${st[p.id].num}번째 성공`, crash: `${st[p.id].num}번째 · 💥 동시에 누름`, early: '부정출발', last: '끝까지 못 누름' }[r]; }
    refresh(); B.score(D);
    later(() => ctx.done(D, `동시 기준 ${(w / 1000).toFixed(1)}초`, '', notes), 1500);
  };
  B.score(D); refresh();
  let n = 3;
  const cd = () => { if (n > 0) { B.info(`${n}…`); n--; later(cd, 800); } else { phase = 'go'; endAt = Date.now() + lim; B.info('시작!'); refresh(); } };
  later(cd, 400);
  every(() => { if (phase !== 'go') return; barTo(endAt, lim); if (Date.now() > endAt) end(); }, 100);
};

/* ───────── 💣 업다운 폭탄 ───────── */
PARTY.updown = (ctx) => {
  const R = ctx.hard ? pick([150, 200, 255, 300]) : pick([30, 50, 64, 99, 100]), bomb = between(1, R), D = zeroD(ctx);
  let lo = 0, hi = R + 1, ti = 0, turnEnd = 0, hist = [], over = false;
  const V = plainScreen(); V.score(ctx, D);
  const per = ctx.timed ? ctx.limit : Infinity;
  const boom = (p) => {
    over = true; ctx.players.forEach((q) => { D[q.id] = q === p ? -60 : 30; });
    V.mid.innerHTML = `<div class="boom pop">💥</div><div class="q">${pname(p)} 펑!<br><small>폭탄은 ${bomb}</small></div>`;
    V.score(ctx, D); later(() => ctx.done(D, `💥 ${p.n} — 폭탄 ${bomb}`, `범위 1~${R} · ${hist.join(' → ')}`), 2200);
  };
  const turn = () => {
    if (over) return;
    const p = ctx.players[ti % ctx.players.length];
    if (hi - lo === 2) { V.mid.innerHTML = `<div class="q">남은 숫자는 폭탄뿐!<br>${pname(p)} 차례…</div>`; later(() => boom(p), 1500); return; }
    turnEnd = Date.now() + per;
    V.mid.innerHTML = `<div class="q"><small>폭탄 숫자를 부르면 펑! · 범위 밖은 안 돼요</small>${pname(p)} 차례</div>
      <div class="bignum" style="font-size:48px">${lo + 1} ~ ${hi - 1}</div>
      <div class="dim small center">${hist.length ? '지금까지: ' + hist.join(' → ') : `1부터 ${R} 사이 어딘가에 폭탄이 있다`}</div>
      <div class="row"><input id="ug" type="text" inputmode="numeric" placeholder="숫자" autocomplete="off" style="text-align:center;font-weight:800;font-size:24px"><button id="uok" style="flex:none;background:${p.c}">부르기</button></div>`;
    const go = (forced) => {
      let g = forced !== undefined ? forced : Number(document.getElementById('ug').value);
      if (!Number.isInteger(g) || g <= lo || g >= hi) return toast(`${lo + 1}~${hi - 1} 사이 숫자를 부르세요`);
      hist.push(g);
      if (g === bomb) return boom(p);
      if (g < bomb) lo = g; else hi = g;
      toast(g < bomb ? `⬆️ ${g}보다 크다` : `⬇️ ${g}보다 작다`);
      ti++; turn();
    };
    document.getElementById('uok').onclick = () => go();
    document.getElementById('ug').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    document.getElementById('ug').focus();
    PARTY._ud = () => go(between(lo + 1, hi - 1));
  };
  turn();
  every(() => { if (over) return; barTo(turnEnd, per); if (Date.now() > turnEnd) { toast('⏰ 시간 초과 — 아무 숫자나 부릅니다'); PARTY._ud(); } }, 150);
};

/* ───────── 👏 369 게임 ───────── */
const RULES369 = [
  { t: '3·6·9가 들어가면 짝', f: (n) => (/[369]/.test(String(n)) ? 1 : 0) },
  { t: '4의 배수면 짝', f: (n) => (n % 4 === 0 ? 1 : 0) },
  { t: '7이 들어가거나 7의 배수면 짝', f: (n) => (n % 7 === 0 || /7/.test(String(n)) ? 1 : 0) },
  { t: '각 자리 숫자의 합이 홀수면 짝 (예: 12 → 1+2=3 → 짝)', f: (n) => ([...String(n)].reduce((a, d) => a + Number(d), 0) % 2 ? 1 : 0), hard: 1 },
  { t: '3·6·9 개수만큼 짝 (33 → 짝짝)', f: (n) => (String(n).match(/[369]/g) || []).length, hard: 1, multi: 1 },
  { t: '5의 배수면 짝, 10의 배수면 짝짝', f: (n) => (n % 10 === 0 ? 2 : n % 5 === 0 ? 1 : 0), hard: 1, multi: 1 },
];
PARTY.g369 = (ctx) => {
  const rule = pick(RULES369.filter((r) => (ctx.hard ? true : !r.hard)));
  const start = between(1, ctx.hard ? 40 : 15), turns = ctx.players.length * (ctx.hard ? 8 : 6), D = zeroD(ctx);
  const per = ctx.timed ? (ctx.hard ? 2500 : 3200) : 7000;
  let n = start, k = 0, turnEnd = 0, last = '', over = false;
  const V = plainScreen(); V.score(ctx, D);
  const fail = (p, why) => {
    over = true; const need = rule.f(n);
    ctx.players.forEach((q) => { D[q.id] = q === p ? -40 : 20; });
    V.mid.innerHTML = `<div class="boom pop">🙅</div><div class="q">${pname(p)} 탈락!<br><small>${esc(why)} · ${n}은 ${need ? '👏'.repeat(need) : '숫자'}였어요</small></div>`;
    V.score(ctx, D); later(() => ctx.done(D, `${p.n} 탈락 (${n})`, `규칙: ${rule.t} · 시작 ${start}`), 2200);
  };
  const intro = () => {
    V.mid.innerHTML = `<div class="q"><small>이번 규칙</small>${esc(rule.t)}</div><div class="bignum" style="font-size:40px">시작: ${start}</div>
      <div class="dim small center" style="line-height:1.6">${ctx.players.map((p) => esc(p.n)).join(' → ')} 순서로 돌아가요<br>숫자는 소리 내서 말하고, 화면에서는 버튼만 누르세요<br>${ctx.players.length}명이 ${turns / ctx.players.length}바퀴 버티면 모두 +30</div>
      <button class="big grn" id="st">시작!</button>`;
    document.getElementById('st').onclick = turn;
  };
  const turn = () => {
    if (over) return;
    if (k >= turns) { ctx.players.forEach((q) => { D[q.id] = 30; }); V.score(ctx, D); V.mid.innerHTML = '<div class="boom pop">🎉</div><div class="q">모두 살아남았다!</div>'; over = true; later(() => ctx.done(D, `${turns}번 모두 성공!`, `규칙: ${rule.t}`), 1800); return; }
    const p = ctx.players[k % ctx.players.length];
    turnEnd = Date.now() + per;
    const opts = rule.multi ? [0, 1, 2] : [0, 1];
    V.mid.innerHTML = `<div class="q"><small>${esc(rule.t)}</small>${pname(p)} 차례</div>
      <div class="center dim">앞사람: <b style="color:var(--txt)">${last || '(첫 순서 · ' + start + '부터)'}</b></div>
      <div class="three" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map((c) => `<button data-c="${c}" style="font-size:${c ? 30 : 22}px;border-color:${p.c}">${c ? '👏'.repeat(c) : '🗣️<br>숫자'}</button>`).join('')}</div>`;
    V.mid.querySelectorAll('[data-c]').forEach((b) => { b.onclick = () => {
      const c = Number(b.dataset.c), need = rule.f(n);
      if (c !== need) return fail(p, '틀렸다!');
      last = c ? '👏'.repeat(c) : `🗣️ ${n}`; n++; k++; turn();
    }; });
  };
  intro();
  every(() => { if (over || !turnEnd) return; barTo(turnEnd, per); if (Date.now() > turnEnd) fail(ctx.players[k % ctx.players.length], '시간 초과'); }, 100);
};

/* ───────── 📈 하이 로우 ───────── */
PARTY.hilo = (ctx) => {
  const deck = shuffle([].concat(...['♠', '♥', '♦', '♣'].map((s) => [...Array(13).keys()].map((v) => ({ v: v + 1, s }))))), D = zeroD(ctx), notes = {};
  const cap = ctx.hard ? 8 : 6, per = ctx.timed ? ctx.limit : Infinity, nm = (c) => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[c.v] || c.v);
  const card = (c) => `<div class="pc ${c.s === '♥' || c.s === '♦' ? 'red' : ''}"><b>${nm(c)}</b><span>${c.s}</span></div>`;
  let pi = 0, cur = deck.pop(), streak = 0, turnEnd = 0, busy = false;
  const V = plainScreen(); V.score(ctx, D);
  const endTurn = (msg) => {
    const p = ctx.players[pi]; notes[p.id] = `${streak}연속`;
    busy = true; V.mid.insertAdjacentHTML('beforeend', `<div class="center" style="font-weight:800">${msg}</div>`);
    later(() => { pi++; streak = 0; busy = false; if (deck.length < 10) deck.push(...shuffle(deck.splice(0))); if (pi >= ctx.players.length) return ctx.done(D, '모두 도전 끝', `연속 ${cap}번이면 보너스 +30`, notes); cur = deck.pop(); draw(); }, 1800);
  };
  const draw = (prev, msg) => {
    const p = ctx.players[pi]; turnEnd = Date.now() + per;
    V.mid.innerHTML = `<div class="q"><small>맞힐 때마다 +15 · ${ctx.hard ? '같은 숫자는 실패' : '같은 숫자는 통과'} · ${cap}연속 보너스 +30</small>${pname(p)} 차례 · ${streak}연속</div>
      <div class="pcs">${prev ? card(prev) + '<span class="arr">→</span>' : ''}${card(cur)}</div>
      ${msg ? `<div class="center" style="font-weight:800">${msg}</div>` : ''}
      <div class="two"><button data-h="1">⬆️<br><span style="font-size:18px">더 높다</span></button><button data-h="0">⬇️<br><span style="font-size:18px">더 낮다</span></button></div>`;
    V.mid.querySelectorAll('[data-h]').forEach((b) => { b.onclick = () => guess(Number(b.dataset.h)); });
  };
  const guess = (up) => {
    if (busy) return; const p = ctx.players[pi], nx = deck.pop(), prev = cur; cur = nx;
    const ok = nx.v === prev.v ? !ctx.hard : up ? nx.v > prev.v : nx.v < prev.v;
    if (!ok) { draw(prev); V.mid.querySelector('.two').remove(); return endTurn(`❌ ${nm(nx)}${nx.v === prev.v ? ' — 같은 숫자!' : ''} · 차례 끝`); }
    streak++; D[p.id] += 15; V.score(ctx, D);
    if (streak >= cap) { D[p.id] += 30; V.score(ctx, D); draw(prev); V.mid.querySelector('.two').remove(); return endTurn(`🎉 ${cap}연속! 보너스 +30`); }
    draw(prev, `⭕ ${nm(nx)}! +15`);
  };
  draw();
  every(() => { if (busy) return; barTo(turnEnd, per); if (Date.now() > turnEnd) { busy = true; endTurn('⏰ 시간 초과'); } }, 150);
};

/* ───────── ⏱️ 타이밍 스톱 ───────── */
PARTY.stopwatch = (ctx) => {
  const target = ctx.hard ? between(1200, 2500) / 100 : pick([333, 500, 555, 777, 1000, 888, 618, 1234, 700, 999]) / 100;
  const show = ctx.hard ? 700 : 2000, res = {}, D = zeroD(ctx);
  let pi = 0, t0 = 0, running = false;
  const V = plainScreen(); V.score(ctx, D);
  const turn = () => {
    if (pi >= ctx.players.length) return finish();
    const p = ctx.players[pi]; running = false;
    V.mid.innerHTML = `<div class="q"><small>목표 시간에 최대한 가깝게 멈추기 · 처음 ${show / 1000}초만 보여요</small>${pname(p)} 차례</div>
      <div class="bignum" style="font-size:30px">목표 ${target.toFixed(2)}초</div><div class="sw" id="sw">0.00</div>
      <button class="big" id="swb" style="background:${p.c}">시작</button>`;
    const sw = document.getElementById('sw'), btn = document.getElementById('swb');
    btn.onclick = () => {
      if (!running) {
        running = true; t0 = performance.now(); btn.textContent = '멈춰!'; btn.classList.add('pink');
        const tick = every(() => { if (!running) return clearInterval(tick); const e = (performance.now() - t0) / 1000; sw.textContent = e * 1000 < show ? e.toFixed(2) : '??.??'; if (e > target + 15) btn.onclick(); }, 30);
      } else {
        running = false; const e = (performance.now() - t0) / 1000; res[p.id] = e;
        sw.textContent = e.toFixed(2); btn.disabled = true;
        V.mid.insertAdjacentHTML('beforeend', `<div class="center" style="font-weight:800">${Math.abs(e - target) < 0.05 ? '🎯 ' : ''}오차 ${(e - target >= 0 ? '+' : '−') + Math.abs(e - target).toFixed(2)}초</div>`);
        later(() => { pi++; turn(); }, 1600);
      }
    };
  };
  const finish = () => {
    const rk = ctx.players.slice().sort((a, b) => Math.abs(res[a.id] - target) - Math.abs(res[b.id] - target)), pts = [80, 50, 30], notes = {};
    rk.forEach((p, i) => { const err = Math.abs(res[p.id] - target); D[p.id] = ctx.players.length > 1 ? (pts[i] || 10) : Math.max(0, Math.round(100 - err * 60)); if (err < 0.05) D[p.id] += 20; notes[p.id] = `${res[p.id].toFixed(2)}초 (오차 ${err.toFixed(2)})${err < 0.05 ? ' 🎯 +20' : ''}`; });
    ctx.done(D, `목표 ${target.toFixed(2)}초`, '', notes);
  };
  barTo(Infinity); turn();
};

/* ───────── 🤥 라이어 게임 ───────── */
PARTY.liarw = (ctx) => {
  const cat = pick(Object.keys(LIAR_WORDS)), words = shuffle(LIAR_WORDS[cat]), word = words[0];
  const liar = pick(ctx.players), fool = ctx.hard, foolWord = words[1], D = zeroD(ctx);
  const seeOrder = ctx.players;
  const see = (k) => {
    if (k >= seeOrder.length) return talk();
    const p = seeOrder[k];
    passView(p, '혼자서만 제시어를 확인하세요', () => {
      const isL = p === liar;
      $app.innerHTML = `<div class="topbar">${roundBadge()}</div>
        <div class="pass pop">${isL && !fool ? `<div class="big1">🤥</div><div class="pn" style="color:var(--pink)">당신은 라이어!</div><div class="dim">주제: <b style="color:var(--txt)">${cat}</b></div><div class="small dim" style="margin-top:10px">제시어를 아는 척하세요. 들키면 제시어를 맞혀서 역전할 수 있어요.</div>`
          : `<div class="dim">주제: <b style="color:var(--txt)">${cat}</b></div><div class="dim" style="margin-top:8px">제시어</div><div class="pn">${esc(isL ? foolWord : word)}</div>`}</div>
        <button class="big" id="ok">확인했어요 (화면 가리고 넘기기)</button>`;
      document.getElementById('ok').onclick = () => see(k + 1);
    });
  };
  const talk = () => {
    const first = pick(ctx.players), endAt = ctx.timed ? Date.now() + ctx.limit : Infinity;
    const V = plainScreen();
    V.mid.innerHTML = `<div class="q"><small>주제: ${cat}${fool ? ' · 바보 라이어 모드: 라이어도 자기가 라이어인 줄 몰라요!' : ''}</small>💬 돌아가며 제시어를 한 마디씩 설명하세요</div>
      <div class="dim center" style="line-height:1.6">${pname(first)}부터 시계 방향으로, 2바퀴 정도<br>너무 자세히 말하면 라이어가 눈치채요!</div>
      <button class="big grn" id="vote">투표하기 🗳️</button>`;
    document.getElementById('vote').onclick = vote;
    every(() => { barTo(endAt, ctx.limit); V.info(endAt === Infinity ? '' : `${Math.max(0, Math.ceil((endAt - Date.now()) / 1000))}초`); if (Date.now() > endAt && document.getElementById('vote')) { PT.clear(); vote(); } }, 200);
  };
  const vote = () => {
    PT.clear();
    const V = plainScreen(); barTo(Infinity);
    V.mid.innerHTML = `<div class="q"><small>다 같이 의논해서 한 명을 고르세요</small>라이어는 누구?</div>
      <div class="opts" style="grid-template-columns:1fr 1fr">${ctx.players.map((p) => `<button class="opt" data-p="${p.id}" style="text-align:center;border-color:${p.c}">${esc(p.n)}</button>`).join('')}</div>`;
    V.mid.querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => judge(byId(ctx, b.dataset.p)); });
  };
  const judge = (ch) => {
    const V = plainScreen(); barTo(Infinity);
    if (ch !== liar) {
      D[liar.id] = 120;
      V.mid.innerHTML = `<div class="boom pop">🤥</div><div class="q">${pname(ch)}은(는) 라이어가 아니었다!<br><small>진짜 라이어는 ${esc(liar.n)}</small></div><button class="big" id="ok">결과 보기</button>`;
      document.getElementById('ok').onclick = () => ctx.done(D, `라이어 ${liar.n} 승리! · 제시어: ${word}`, fool ? `라이어가 받은 제시어: ${foolWord}` : '');
      return;
    }
    const opts = shuffle(words.slice(0, 8));
    V.mid.innerHTML = `<div class="boom pop">🎯</div><div class="q">라이어 ${pname(liar)} 검거!<br><small>마지막 기회 — 제시어를 맞히면 라이어가 이겨요</small></div>
      <div class="opts" style="grid-template-columns:1fr 1fr">${opts.map((w) => `<button class="opt" data-w="${esc(w)}" style="text-align:center">${esc(w)}</button>`).join('')}</div>`;
    V.mid.querySelectorAll('[data-w]').forEach((b) => { b.onclick = () => {
      const ok = b.dataset.w === word;
      if (ok) D[liar.id] = 80; else ctx.players.forEach((p) => { if (p !== liar) D[p.id] = 50; });
      ctx.done(D, ok ? `라이어 ${liar.n} 역전승! 제시어 「${word}」를 맞혔다` : `시민 승리! 라이어 ${liar.n}의 답 「${b.dataset.w}」 · 제시어 「${word}」`, fool ? `라이어가 받은 제시어: ${foolWord}` : '');
    }; });
  };
  see(0);
};

/* ═════════════ 차례 게임 화면 (각자 자기 문제) ═════════════ */
// stage 에 문제를 그리고, 답이 정해지면 submit(값)을 부른다
function renderTurn(stage, T, q, fx) {
  const cls = (fx.includes('fog') ? ' fog' : '') + (fx.includes('mirror') ? ' mirror' : '');
  const submit = (v) => { if (locked) return; turnSubmit(v); };
  const qbox = (inner, small) => `<div class="q${cls}">${small ? `<small>${esc(small)}</small>` : ''}${inner}</div>`;
  const numInput = (ph, mode) => `<input id="in" type="text" inputmode="${mode || 'numeric'}" placeholder="${esc(ph)}" style="text-align:center;font-weight:800;font-size:22px" autocomplete="off"><button class="big" id="ok">제출</button>`;
  const bindInput = (check) => {
    const go = () => { const v = document.getElementById('in').value.trim(); const res = check(v); if (res === undefined) return; submit(res); };
    document.getElementById('ok').onclick = go;
    document.getElementById('in').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  };
  const choice = (sel) => stage.querySelectorAll(sel).forEach((b) => { b.onclick = () => { b.classList.add('sel'); submit(Number(b.dataset.i)); }; });
  if (T === 'trivia') {
    stage.innerHTML = qbox(esc(q.text), q.cat) + `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${['①', '②', '③', '④'][i]}&nbsp; ${esc(o)}</button>`).join('')}</div>`;
    choice('.opt');
  } else if (T === 'liar') {
    stage.innerHTML = qbox(`${esc(q.crime || '범인')}${q.crime && /[가-힣]/.test(q.crime) && hasB(q.crime) ? '은' : '는'} 누구일까?`, `${q.names.length}명 중 정확히 ${q.T}명만 진실을 말한다 · ${q.crime || '범인'}은 1명`) +
      `<div class="col${cls}">${q.lines.map((l) => `<div class="card" style="padding:12px;font-weight:700;font-size:17px">${esc(l)}</div>`).join('')}</div>
      <div class="opts" style="grid-template-columns:1fr 1fr">${q.names.map((n, i) => `<button class="opt" style="text-align:center" data-i="${i}">${esc(n)}</button>`).join('')}</div>`;
    choice('.opt');
  } else if (T === 'sequence') {
    stage.innerHTML = qbox('다음에 올 수는?') + `<div class="seq${cls}">${q.seq.map((n) => `<span>${n}</span>`).join('')}<span class="qm">?</span></div>` + numInput('정답 입력', 'text');
    bindInput((v) => (/^-?\d+$/.test(v) ? Number(v) : (toast('정수를 입력하세요'), undefined)));
  } else if (T === 'fermi') {
    stage.innerHTML = qbox(esc(q.text), `단위: ${q.unit}`) + numInput(`어림값 (${q.unit})`, 'decimal') + '<div class="dim small center">정답의 약 −22% ~ +28% 안이면 득점</div>';
    bindInput((v) => { const n = Number(v.replace(/,/g, '')); return n > 0 ? n : (toast('0보다 큰 수를 입력하세요'), undefined); });
  } else if (T === 'chosung') {
    stage.innerHTML = qbox(`<span style="font-size:44px;letter-spacing:6px;color:var(--yel)">${esc(q.cho)}</span>`, `분류: ${q.cat} · 띄어쓰기 없이`) + numInput('단어 입력', 'text');
    bindInput((v) => (v ? v.replace(/\s+/g, '') : (toast('단어를 입력하세요'), undefined)));
  } else if (T === 'code') {
    const L = q.L || 3;
    stage.innerHTML = qbox(`${L === 4 ? '네' : '세'} 자리 비밀번호는?`, '0~9 서로 다른 숫자 · S=숫자·자리 일치, B=숫자만 일치') +
      `<div class="col${cls}">${q.clues.map((c) => `<div class="card row" style="padding:10px 14px"><b style="font-size:24px;letter-spacing:6px" class="grow">${c.g}</b><b>${c.s || c.b ? `${c.s ? `<span class="pos">${c.s}S</span> ` : ''}${c.b ? `<span style="color:var(--yel)">${c.b}B</span>` : ''}` : '<span class="neg">OUT</span>'}</b></div>`).join('')}</div>` + numInput(L === 4 ? '예: 4829' : '예: 482');
    bindInput((v) => (new RegExp(`^\\d{${L}}$`).test(v) && new Set(v).size === L ? v : (toast(`서로 다른 숫자 ${L}자리를 입력하세요`), undefined)));
  } else if (T === 'timeline') timelineUI(stage, q, cls, submit);
  else if (T === 'calc24') calcUI(stage, q, cls, submit);
  else if (T === 'memory') memoryUI(stage, q, submit);
  else if (T === 'digits') digitsUI(stage, q, cls, submit);
  else if (T === 'mental') mentalUI(stage, q, cls, submit);
  else if (T === 'stroop') stroopUI(stage, q, cls, submit);
  else if (UI2[T] || q.ui) (q.ui ? UI2.generic : UI2[T])({ stage, q, cls, submit, qbox, numInput, bindInput, choice, T });
  if (fx.includes('fog')) setTimeout(() => stage.querySelectorAll('.fog').forEach((e) => e.classList.add('clear')), 5000);
}

function timelineUI(stage, q, cls, submit) {
  const order = [];
  const draw = () => {
    stage.innerHTML = `<div class="q${cls}"><small>오래된 것부터 차례로 누르세요</small>역사 줄 세우기</div>
      <div class="opts">${q.items.map((it, i) => { const n = order.indexOf(i); return `<button class="opt ${n >= 0 ? 'sel' : ''}" data-i="${i}"><b style="color:var(--yel);display:inline-block;width:28px">${n >= 0 ? n + 1 : '·'}</b>${esc(it)}</button>`; }).join('')}</div>
      <div class="row"><button class="sec grow" id="bk">⌫ 되돌리기</button><button class="big grow" id="ok" ${order.length === q.items.length ? '' : 'disabled'}>제출</button></div>`;
    stage.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.i); if (!order.includes(i)) order.push(i); draw(); }; });
    document.getElementById('bk').onclick = () => { order.pop(); draw(); };
    document.getElementById('ok').onclick = () => submit(order.slice());
  };
  draw();
}

function calcUI(stage, q, cls, submit) {
  let toks = [];
  const render = () => {
    const used = new Set(toks.filter((t) => t.k === 'n').map((t) => t.i));
    const last = toks.length ? toks[toks.length - 1].v : null;
    const lastIsVal = last !== null && (/^\d+$/.test(last) || last === ')');
    const str = toks.map((t) => t.v).join('');
    let live = '<em>&nbsp;</em>', can = false;
    if (toks.length) {
      try { const v = Expr.evaluate(str.replace(/−/g, '-')).value; live = `<em>= ${v.d === 1 ? v.n : v.n + '/' + v.d}</em>`; can = used.size === 4 && v.d === 1 && v.n === q.target; } catch (e) { /* */ }
    }
    stage.innerHTML = `<div class="q${cls}"><small>네 숫자를 한 번씩만 써서</small></div><div class="target${cls}">${q.target}</div>
      <div class="expr">${esc(str) || '<span class="dim">식을 만드세요</span>'}${live}</div>
      <div class="nums">${q.nums.map((n, i) => `<button data-n="${i}" class="${used.has(i) || lastIsVal ? 'used' : ''}" ${used.has(i) || lastIsVal ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      <div class="ops">${['+', '−', '×', '÷', '(', ')'].map((o) => `<button data-o="${o}" ${(o === '(' && lastIsVal) || (o !== '(' && !lastIsVal) ? 'disabled' : ''}>${o}</button>`).join('')}</div>
      <div class="row"><button class="sec grow" id="bk">⌫ 지우기</button><button class="sec grow" id="cl">전체 삭제</button></div>
      <button class="big" id="ok" ${can ? '' : 'disabled'}>${can ? '제출 (정답!)' : '목표 숫자를 만들면 제출할 수 있어요'}</button>`;
    stage.querySelectorAll('[data-n]').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.n); toks.push({ k: 'n', i, v: String(q.nums[i]) }); render(); }; });
    stage.querySelectorAll('[data-o]').forEach((b) => { b.onclick = () => { toks.push({ k: 'o', v: b.dataset.o }); render(); }; });
    document.getElementById('bk').onclick = () => { toks.pop(); render(); };
    document.getElementById('cl').onclick = () => { toks = []; render(); };
    document.getElementById('ok').onclick = () => submit(str.replace(/−/g, '-').replace(/×/g, '*').replace(/÷/g, '/'));
  };
  render();
}

function memoryUI(stage, q, submit) {
  const picks = new Set();
  let showing = performance.now() - playT0 < q.showMs;
  const draw = () => {
    stage.innerHTML = `<div class="q"><small>패턴 기억</small>${showing ? '빛나는 칸을 외우세요!' : `기억한 칸을 모두 누르세요 <span class="dim">(${q.cells.length}칸)</span>`}</div>
      <div class="grid4" style="grid-template-columns:repeat(${q.n || 4},1fr)">${[...Array((q.n || 4) ** 2).keys()].map((i) => `<button class="cell ${showing && q.cells.includes(i) ? 'lit' : ''} ${!showing && picks.has(i) ? 'pick' : ''}" data-i="${i}" ${showing ? 'disabled' : ''}></button>`).join('')}</div>
      <button class="big" id="ok" ${showing || !picks.size ? 'disabled' : ''}>제출 (${picks.size}칸)</button>`;
    stage.querySelectorAll('.cell').forEach((c) => { c.onclick = () => { const i = Number(c.dataset.i); picks.has(i) ? picks.delete(i) : picks.add(i); draw(); }; });
    document.getElementById('ok').onclick = () => submit([...picks]);
  };
  draw();
  if (showing) setTimeout(() => { showing = false; if (!locked && document.getElementById('stage') === stage) draw(); }, Math.max(150, q.showMs - (performance.now() - playT0)));
}

function digitsUI(stage, q, cls, submit) {
  const left = q.showMs - (performance.now() - playT0);
  const ask = () => {
    stage.innerHTML = `<div class="q${cls}"><small>숫자 기억</small>${q.rev ? '<span style="color:var(--pink)">거꾸로</span> 입력하세요!' : '본 그대로 입력하세요'}</div>
      <input id="in" type="text" inputmode="numeric" placeholder="${q.d.length}자리" style="text-align:center;font-weight:800;font-size:26px;letter-spacing:4px" autocomplete="off"><button class="big" id="ok">제출</button>`;
    const go = () => { const v = document.getElementById('in').value.replace(/\D/g, ''); if (!v) return toast('숫자를 입력하세요'); submit(v); };
    document.getElementById('ok').onclick = go; document.getElementById('in').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    document.getElementById('in').focus();
  };
  if (left <= 0) return ask();
  stage.innerHTML = `<div class="q"><small>숫자 기억 · ${q.d.length}자리</small>${q.rev ? '외운 뒤 <span style="color:var(--pink)">거꾸로</span> 입력합니다' : '그대로 외우세요'}</div>
    <div class="bignum${cls}" style="font-size:${q.d.length > 8 ? 46 : 54}px;letter-spacing:4px">${q.d}</div>`;
  setTimeout(() => { if (!locked && document.getElementById('stage') === stage) ask(); }, left);
}

function mentalUI(stage, q, cls, submit) {
  const answers = [];
  const draw = () => {
    const i = answers.length;
    stage.innerHTML = `<div class="q"><small>암산 질주 · ${i + 1}/${q.qs.length}</small></div>
      <div class="bignum${cls}" style="font-size:48px">${esc(q.qs[i])}</div>
      <input id="in" type="text" inputmode="numeric" placeholder="=" style="text-align:center;font-weight:800;font-size:28px" autocomplete="off">
      <button class="big" id="ok">${i + 1 < q.qs.length ? '다음 ▶' : '제출'}</button>`;
    const go = () => { const v = document.getElementById('in').value.trim(); if (!/^-?\d+$/.test(v)) return toast('숫자를 입력하세요'); answers.push(Number(v)); if (answers.length >= q.qs.length) submit(answers.slice()); else draw(); };
    document.getElementById('ok').onclick = go; document.getElementById('in').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    document.getElementById('in').focus();
  };
  draw();
}

function stroopUI(stage, q, cls, submit) {
  const answers = [];
  const draw = () => {
    const i = answers.length, it = q.items[i];
    stage.innerHTML = `<div class="q"><small>색깔 함정 · ${i + 1}/${q.items.length}</small>${it.a === 'c' ? '이 글자의 <b style="color:var(--yel)">색</b>은?' : '이 글자의 <b style="color:var(--yel)">뜻</b>은?'}</div>
      <div class="bignum${cls}" style="font-size:72px;color:${COLORS[it.c][1]}">${COLORS[it.w][0]}</div>
      <div class="opts" style="grid-template-columns:1fr 1fr">${COLORS.map((c, j) => `<button class="opt" style="text-align:center" data-i="${j}">${c[0]}</button>`).join('')}</div>`;
    stage.querySelectorAll('.opt').forEach((b) => { b.onclick = () => { answers.push(Number(b.dataset.i)); if (answers.length >= q.items.length) submit(answers.slice()); else draw(); }; });
  };
  draw();
}


/* ═════════════ 새 게임 화면 ═════════════
   UI2[type]({ stage, q, cls, submit, qbox, numInput, bindInput, choice, T }) */
const alive = (stage) => !locked && document.getElementById('stage') === stage;
const linesHTML = (lines, cls) => (lines && lines.length ? `<div class="col clues${cls}">${lines.map((l) => `<div class="clue">${esc(l)}</div>`).join('')}</div>` : '');
// 선택 후 확정 버튼으로 제출
function pickConfirm(u, sel, render) {
  let cur = null;
  u.stage.querySelectorAll(sel).forEach((b) => { b.onclick = () => { cur = Number(b.dataset.i); u.stage.querySelectorAll(sel).forEach((x) => x.classList.toggle('sel', x === b)); if (render) render(cur); document.getElementById('ok').disabled = false; }; });
  document.getElementById('ok').onclick = () => { if (cur !== null) u.submit(cur); };
}

const UI2 = {
  /* 공용: 숫자 입력 / 객관식 */
  generic(u) {
    const q = u.q;
    let body = '';
    if (q.big) body += `<div class="bignum${u.cls}" style="font-size:52px">${esc(q.big)}</div>`;
    body += linesHTML(q.lines, u.cls);
    if (q.grid) body += `<div class="dgrid${u.cls}" style="grid-template-columns:repeat(${q.grid[0].length},1fr)">${[].concat(...q.grid).map((x) => `<span class="${x === '?' ? 'qm' : x === '■' ? 'blk' : x === '' ? 'emp' : ''}">${esc(x)}</span>`).join('')}</div>`;
    if (q.pyr) body += `<div class="pyr${u.cls}">${q.pyr.map((r) => `<div>${r.map((x) => `<span class="${x === '?' ? 'qm' : x === '' ? 'emp' : ''}">${esc(x)}</span>`).join('')}</div>`).join('')}</div>`;
    if (q.ui === 'mc') {
      u.stage.innerHTML = u.qbox(esc(q.text), q.sub) + body + `<div class="opts" style="grid-template-columns:1fr 1fr">${q.options.map((o, i) => `<button class="opt" style="text-align:center" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
      u.choice('.opt');
    } else {
      u.stage.innerHTML = u.qbox(esc(q.text), q.sub) + body + u.numInput('정답 입력', q.decimal ? 'decimal' : 'text');
      u.bindInput((v) => { const n = Number(v.replace(/,/g, '')); return v !== '' && Number.isFinite(n) ? n : (toast('숫자를 입력하세요'), undefined); });
    }
  },

  /* 결! 합! */
  hap(u) {
    const q = u.q, picks = [];
    const SH = ['circle', 'tri', 'sq'], CO = ['#ff4d6d', '#4cc9f0', '#ffd23f'], BG = ['#f4f4f8', '#7d8199', '#14151f'];
    const tile = (t) => { const c = CO[t[1]]; const shape = t[0] === 0 ? `<circle cx="30" cy="30" r="17" fill="${c}"/>` : t[0] === 1 ? `<polygon points="30,10 49,46 11,46" fill="${c}"/>` : `<rect x="13" y="13" width="34" height="34" rx="3" fill="${c}"/>`; return `<svg viewBox="0 0 60 60"><rect width="60" height="60" rx="9" fill="${BG[t[2]]}"/>${shape}</svg>`; };
    const count = q.mode === 'count';
    const draw = () => {
      u.stage.innerHTML = u.qbox(count ? '이 판에 「합」은 모두 몇 개?' : '「합」 하나를 찾아 3장을 눌러라', '모양·색·배경 각각이 3장 모두 같거나 모두 달라야 합') +
        `<div class="hapg${u.cls}">${q.tiles.map((t, i) => `<button class="hapt ${picks.includes(i) ? 'sel' : ''}" data-i="${i}">${tile(t)}<b>${i + 1}</b></button>`).join('')}</div>` +
        (count ? u.numInput('합의 개수') : `<button class="big" id="ok" ${picks.length === 3 ? '' : 'disabled'}>합! (${picks.length}/3)</button>`);
      if (count) { u.bindInput((v) => (/^\d+$/.test(v) ? Number(v) : (toast('숫자를 입력하세요'), undefined))); return; }
      u.stage.querySelectorAll('.hapt').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.i); const k = picks.indexOf(i); if (k >= 0) picks.splice(k, 1); else if (picks.length < 3) picks.push(i); draw(); }; });
      document.getElementById('ok').onclick = () => u.submit(picks.slice());
    };
    draw();
  },

  /* 불 끄기 */
  lights(u) {
    const q = u.q, n = q.n, b = [...q.b].map(Number), presses = [];
    const draw = () => {
      const left = b.filter((x) => x).length;
      u.stage.innerHTML = u.qbox(left ? `켜진 불 ${left}개` : '모두 꺼졌다! 🎉', '누른 칸 + 상하좌우가 뒤집힌다') +
        `<div class="grid4 lights${u.cls}" style="grid-template-columns:repeat(${n},1fr)">${b.map((x, i) => `<button class="cell ${x ? 'on' : ''}" data-i="${i}"></button>`).join('')}</div>
        <div class="row"><button class="sec grow" id="rs">↺ 처음부터 (${presses.length}번 누름)</button></div>
        <button class="big" id="ok" ${left ? 'disabled' : ''}>${left ? '불을 모두 끄면 제출할 수 있어요' : '제출'}</button>`;
      u.stage.querySelectorAll('.cell').forEach((c) => { c.onclick = () => { const i = Number(c.dataset.i); lightsPress(b, n, i); presses.push(i); draw(); }; });
      document.getElementById('rs').onclick = () => { b.splice(0, b.length, ...[...q.b].map(Number)); presses.length = 0; draw(); };
      document.getElementById('ok').onclick = () => u.submit(presses.slice(-200));
    };
    draw();
  },

  /* 미니 스도쿠 */
  sudoku(u) {
    const q = u.q, n = q.n, g = [...q.g].map(Number), cur = g.slice(); let sel = cur.indexOf(0);
    const bad = () => { const out = new Set(); for (let i = 0; i < n * n; i++) { if (!cur[i]) continue; const r = Math.floor(i / n), c = i % n; for (let j = 0; j < n * n; j++) { if (j === i || cur[j] !== cur[i]) continue; const r2 = Math.floor(j / n), c2 = j % n; if (r === r2 || c === c2 || (Math.floor(r / q.bh) === Math.floor(r2 / q.bh) && Math.floor(c / q.bw) === Math.floor(c2 / q.bw))) out.add(i); } } return out; };
    const draw = () => {
      const B = bad(), full = cur.every((x) => x);
      u.stage.innerHTML = u.qbox(`${n}×${n} 스도쿠`, `가로·세로·굵은 칸(${q.bh}×${q.bw})마다 1~${n}이 한 번씩`) +
        `<div class="sdk${u.cls}" style="grid-template-columns:repeat(${n},1fr)">${cur.map((x, i) => { const r = Math.floor(i / n), c = i % n; const cl = [g[i] ? 'giv' : '', i === sel ? 'sel' : '', B.has(i) ? 'bad' : '', c % q.bw === 0 && c ? 'bl' : '', r % q.bh === 0 && r ? 'bt' : ''].join(' '); return `<button class="${cl}" data-i="${i}">${x || ''}</button>`; }).join('')}</div>
        <div class="nums" style="grid-template-columns:repeat(${n + 1},1fr)">${[...Array(n).keys()].map((k) => `<button data-v="${k + 1}">${k + 1}</button>`).join('')}<button data-v="0" class="sec">⌫</button></div>
        <button class="big" id="ok" ${full && !B.size ? '' : 'disabled'}>${full ? (B.size ? '겹치는 숫자가 있어요' : '제출') : '빈칸을 모두 채우세요'}</button>`;
      u.stage.querySelectorAll('.sdk button').forEach((c) => { c.onclick = () => { const i = Number(c.dataset.i); if (!g[i]) { sel = i; draw(); } }; });
      u.stage.querySelectorAll('[data-v]').forEach((c) => { c.onclick = () => { if (sel < 0 || g[sel]) return; cur[sel] = Number(c.dataset.v); if (cur[sel]) { const nx = cur.findIndex((x, j) => j > sel && !x); if (nx >= 0) sel = nx; } draw(); }; });
      document.getElementById('ok').onclick = () => u.submit(cur.join(''));
    };
    draw();
  },

  /* 노노그램 */
  nono(u) {
    const q = u.q, n = q.n, st = Array(n * n).fill(0); // 0 빈칸 1 칠함 2 X표
    const mx = Math.max(...q.cols.map((c) => c.length));
    const draw = () => {
      const bits = st.map((x) => (x === 1 ? 1 : 0)), c = nonoClues(bits, n);
      const rOk = q.rows.map((r, i) => JSON.stringify(r) === JSON.stringify(c.rows[i])), cOk = q.cols.map((r, i) => JSON.stringify(r) === JSON.stringify(c.cols[i]));
      const done = rOk.every(Boolean) && cOk.every(Boolean);
      const sz = n >= 7 ? 34 : 44;
      let h = `<div class="nono${u.cls}" style="grid-template-columns:auto repeat(${n},${sz}px)"><span></span>`;
      for (let j = 0; j < n; j++) h += `<span class="cc ${cOk[j] ? 'ok' : ''}">${Array(mx - q.cols[j].length).fill('').concat(q.cols[j]).map((x) => `<i>${x === '' ? '&nbsp;' : x}</i>`).join('')}</span>`;
      for (let i = 0; i < n; i++) {
        h += `<span class="rc ${rOk[i] ? 'ok' : ''}">${q.rows[i].join(' ')}</span>`;
        for (let j = 0; j < n; j++) { const k = i * n + j; h += `<button class="nc s${st[k]}" data-i="${k}" style="height:${sz}px">${st[k] === 2 ? '✕' : ''}</button>`; }
      }
      h += '</div>';
      u.stage.innerHTML = u.qbox(`${n}×${n} 노노그램`, '숫자 = 연속으로 칠한 칸의 길이 (순서대로) · 탭: 칠함 → ✕ → 빈칸') + h +
        `<div class="row"><button class="sec grow" id="rs">↺ 지우기</button></div><button class="big" id="ok">${done ? '제출 (단서 모두 일치!)' : '제출'}</button>`;
      u.stage.querySelectorAll('.nc').forEach((b) => { b.onclick = () => { const k = Number(b.dataset.i); st[k] = (st[k] + 1) % 3; draw(); }; });
      document.getElementById('rs').onclick = () => { st.fill(0); draw(); };
      document.getElementById('ok').onclick = () => u.submit(bits.join(''));
    };
    draw();
  },

  /* 성냥개비 */
  match(u) {
    const q = u.q; let typed = '';
    u.stage.innerHTML = u.qbox('성냥개비 하나만 옮겨 참인 식을 만들어라', '‘=’는 그대로 · 숫자는 숫자로, 부호는 + 또는 − 로') +
      `<div class="mtc${u.cls}">${matchSVG(q.eq)}</div>
      <div class="expr" id="ty"></div>
      <div class="ops" style="grid-template-columns:repeat(7,1fr)">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '+', '−', '=', '⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('')}</div>
      <div class="row"><button class="sec grow" id="cp">원래 식 불러오기</button></div>
      <button class="big" id="ok">제출</button>`;
    const show = () => { document.getElementById('ty').innerHTML = typed ? esc(typed) : '<span class="dim">고친 식을 입력</span>'; };
    u.stage.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => { const k = b.dataset.k; if (k === '⌫') typed = typed.slice(0, -1); else if (typed.length < 12) typed += k; show(); }; });
    document.getElementById('cp').onclick = () => { typed = q.eq.replace(/-/g, '−'); show(); };
    document.getElementById('ok').onclick = () => { const v = typed.replace(/−/g, '-'); if (!/^\d+[+-]\d+=\d+$/.test(v)) return toast('“숫자 부호 숫자 = 숫자” 꼴로 입력하세요'); u.submit(v); };
    show();
  },

  /* 기사와 건달 */
  knights(u) {
    const q = u.q, st = q.names.map(() => null);
    const draw = () => {
      u.stage.innerHTML = u.qbox('누가 기사이고 누가 건달일까?', '😇 기사: 항상 참 · 😈 건달: 항상 거짓') + linesHTML(q.lines, u.cls) +
        `<div class="opts" style="grid-template-columns:1fr 1fr">${q.names.map((n, i) => `<button class="opt kn" data-i="${i}" style="text-align:center">${esc(n)}<br><span style="font-size:26px">${st[i] === null ? '❔' : st[i] ? '😇' : '😈'}</span></button>`).join('')}</div>
        <button class="big" id="ok" ${st.includes(null) ? 'disabled' : ''}>${st.includes(null) ? '모두 정하면 제출 (눌러서 바꾸기)' : '제출'}</button>`;
      u.stage.querySelectorAll('.kn').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.i); st[i] = st[i] === null ? true : !st[i]; draw(); }; });
      document.getElementById('ok').onclick = () => u.submit(st.reduce((m, x, i) => m | (x ? 1 << i : 0), 0));
    };
    draw();
  },

  /* 가짜 동전 */
  coin(u) {
    const q = u.q; let c = null, h = q.hl ? null : 0;
    const draw = () => {
      u.stage.innerHTML = u.qbox(`동전 ${q.N}개 중 가짜 하나는?`, q.hl ? '가짜는 진짜보다 무겁거나 가볍다 (어느 쪽인지 모름)' : '가짜는 진짜보다 무겁다') + linesHTML(q.lines, u.cls) +
        `<div class="nums" style="grid-template-columns:repeat(${q.N > 9 ? 6 : q.N > 8 ? 5 : 4},1fr)">${[...Array(q.N).keys()].map((i) => `<button data-c="${i}" class="${c === i ? 'csel' : ''}" style="font-size:24px">${circ(i)}</button>`).join('')}</div>
        ${q.hl ? `<div class="two" style="gap:8px"><button data-h="0" class="${h === 0 ? 'sel' : ''}" style="padding:16px 0;font-size:18px">⬆️ 무겁다</button><button data-h="1" class="${h === 1 ? 'sel' : ''}" style="padding:16px 0;font-size:18px">⬇️ 가볍다</button></div>` : ''}
        <button class="big" id="ok" ${c !== null && h !== null ? '' : 'disabled'}>제출</button>`;
      u.stage.querySelectorAll('[data-c]').forEach((b) => { b.onclick = () => { c = Number(b.dataset.c); draw(); }; });
      u.stage.querySelectorAll('[data-h]').forEach((b) => { b.onclick = () => { h = Number(b.dataset.h); draw(); }; });
      document.getElementById('ok').onclick = () => u.submit(c * 2 + h);
    };
    draw();
  },

  /* 연산자 넣기 */
  ops(u) {
    const q = u.q, sl = q.nums.slice(1).map(() => null), SHOW = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    const draw = () => {
      let live = '';
      if (!sl.includes(null)) { try { const v = Expr.evaluate(opsExpr(q.nums, sl)).value; live = `= ${v.d === 1 ? v.n : v.n + '/' + v.d}`; } catch (e) { live = '계산 불가'; } }
      const ok = !sl.includes(null) && live === `= ${q.target}`;
      u.stage.innerHTML = u.qbox('빈칸을 눌러 연산자를 바꿔라', `${q.ops.map((o) => SHOW[o]).join(' ')} 사용 · 곱셈·나눗셈 먼저`) +
        `<div class="opsrow${u.cls}">${q.nums.map((n, i) => `<b>${n}</b>${i < sl.length ? `<button data-s="${i}" class="${sl[i] ? 'f' : ''}">${sl[i] ? SHOW[sl[i]] : '?'}</button>` : ''}`).join('')}<b>=</b><b class="tg">${q.target}</b></div>
        <div class="center ${ok ? 'pos' : 'dim'}" style="font-weight:800;min-height:22px">${esc(live)}</div>
        <button class="big" id="ok" ${ok ? '' : 'disabled'}>${ok ? '제출 (정답!)' : '등식이 맞으면 제출할 수 있어요'}</button>`;
      u.stage.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => { const i = Number(b.dataset.s); sl[i] = q.ops[(q.ops.indexOf(sl[i]) + 1) % q.ops.length]; draw(); }; });
      document.getElementById('ok').onclick = () => u.submit(sl.join(''));
    };
    draw();
  },

  /* 순서 기억 */
  simon(u) {
    const q = u.q, n = q.n, seq = q.seq, t0 = 600, picks = [];
    const showEnd = t0 + seq.length * q.stepMs;
    const grid = (lit, dis) => `<div class="grid4 simon" style="grid-template-columns:repeat(${n},1fr)">${[...Array(n * n).keys()].map((i) => `<button class="cell ${i === lit ? 'lit' : ''}" data-i="${i}" ${dis ? 'disabled' : ''}></button>`).join('')}</div>`;
    const ask = () => {
      u.stage.innerHTML = `<div class="q"><small>순서 기억 · ${seq.length}단계</small>본 순서대로 누르세요 <span class="dim">(${picks.length}/${seq.length})</span></div>${grid(-1, false)}<button class="sec" id="rs">↺ 다시 입력</button>`;
      u.stage.querySelectorAll('.cell').forEach((c) => { c.onclick = () => { picks.push(Number(c.dataset.i)); c.classList.add('pick'); if (picks.length >= seq.length) u.submit(picks.slice()); else setTimeout(() => { if (alive(u.stage)) ask(); }, 120); }; });
      document.getElementById('rs').onclick = () => { picks.length = 0; ask(); };
    };
    const tick = () => {
      if (!alive(u.stage)) return;
      const e = performance.now() - playT0;
      if (e >= showEnd) return ask();
      const k = Math.floor((e - t0) / q.stepMs), within = (e - t0) % q.stepMs < q.stepMs * 0.72;
      u.stage.innerHTML = `<div class="q"><small>순서 기억 · ${seq.length}단계</small>${e < t0 ? '잘 보세요…' : `${k + 1}번째`}</div>${grid(e >= t0 && within ? seq[k] : -1, true)}`;
      setTimeout(tick, 60);
    };
    tick();
  },

  /* 순간 포착 */
  count(u) {
    const q = u.q, left = q.showMs - (performance.now() - playT0);
    const ask = () => {
      u.stage.innerHTML = u.qbox(`<span style="font-size:46px">${q.target}</span><br>몇 개였을까?`, '순간 포착') + u.numInput('개수');
      u.bindInput((v) => (/^\d+$/.test(v) ? Number(v) : (toast('숫자를 입력하세요'), undefined)));
      document.getElementById('in').focus();
    };
    if (left <= 0) return ask();
    u.stage.innerHTML = `<div class="q"><small>순간 포착</small>${q.pre ? `<span style="font-size:30px">${q.target}</span> 의 개수를 세세요!` : '잘 보세요! 무엇을 물을지는 비밀'}</div>
      <div class="cgrid${u.cls}" style="grid-template-columns:repeat(${q.cols},1fr)">${q.cells.map((x) => `<span>${x}</span>`).join('')}</div>`;
    setTimeout(() => { if (alive(u.stage)) ask(); }, left);
  },

  /* 틀린 하나 */
  odd(u) {
    const q = u.q;
    u.stage.innerHTML = u.qbox('하나만 다르다. 찾아서 누르세요!', '한 번만 누를 수 있어요') +
      `<div class="oddg${u.cls}" style="grid-template-columns:repeat(${q.cols},1fr)">${q.cells.map((x, i) => `<button data-i="${i}">${esc(x)}</button>`).join('')}</div>`;
    u.stage.querySelectorAll('.oddg button').forEach((b) => { b.onclick = () => u.submit(Number(b.dataset.i)); });
  },

  /* 순서대로 터치 */
  schulte(u) {
    const q = u.q, N = q.n * q.n; let next = 1, miss = 0;
    u.stage.innerHTML = `<div class="q"><small>순서대로 터치</small>다음: <b id="nx" style="color:var(--yel)">1</b> <span class="dim small" id="ms"></span></div>
      <div class="oddg schulte${u.cls}" style="grid-template-columns:repeat(${q.n},1fr)">${q.cells.map((x) => `<button data-v="${x}">${x}</button>`).join('')}</div>`;
    u.stage.querySelectorAll('.schulte button').forEach((b) => {
      b.onclick = () => {
        if (Number(b.dataset.v) === next) { b.classList.add('done2'); b.disabled = true; next++; if (next > N) return u.submit(miss); document.getElementById('nx').textContent = next; }
        else { miss++; b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 250); document.getElementById('ms').textContent = `실수 ${miss}${miss > 3 ? ' (4번부터 실격)' : ''}`; }
      };
    });
  },

  /* ── 심리전 ── */
  beauty(u) {
    const q = u.q, [mn, md] = q.mul || [2, 3], max = q.max || 100, mid = Math.round(max / 2);
    u.stage.innerHTML = u.qbox(`모두의 평균 × <b style="color:var(--yel)">${mn}/${md}</b>에<br>가장 가까운 숫자는?`, `0 ~ ${max} · 이번 배율 ${mn}/${md}`) + `<div class="bignum" id="bn">${mid}</div><input class="slider" id="sl" type="range" min="0" max="${max}" value="${mid}"><button class="big" id="ok">이 숫자로 확정</button>`;
    const sl = document.getElementById('sl'); sl.oninput = () => { document.getElementById('bn').textContent = sl.value; };
    document.getElementById('ok').onclick = () => u.submit(Number(sl.value));
  },
  minority(u) {
    const q = u.q;
    u.stage.innerHTML = u.qbox('사람이 더 적은 쪽이 이깁니다', '소수결 · 동점이면 무승부') +
      `<div class="two"><button data-i="0" style="font-size:24px">${esc(q.A || 'A')}</button><button data-i="1" style="font-size:24px">${esc(q.B || 'B')}</button></div><button class="big" id="ok" disabled>확정</button>`;
    pickConfirm(u, '.two button');
  },
  split(u) {
    const q = u.q, C = q.coop || 60, POT = q.pot || 130, L = q.lose || 30;
    u.stage.innerHTML = u.qbox(`전원 협력: 모두 <span class="pos">+${C}</span><br>배신자 있음: 배신자끼리 <span class="pos">${POT}</span> 나눠 갖기, 협력자 <span class="neg">−${L}</span><br>전원 배신: 모두 <span class="neg">−${L}</span>`, '이번 판 보상') +
      '<div class="two"><button data-i="0">🤝<br><span style="font-size:18px">협력</span></button><button data-i="1">🗡️<br><span style="font-size:18px">배신</span></button></div><button class="big" id="ok" disabled>확정</button>';
    pickConfirm(u, '.two button');
  },
  lowest(u) {
    const max = u.q.max || 10;
    u.stage.innerHTML = u.qbox('나만 고른 수 중 가장 작으면 승리', `1 ~ ${max}`) + `<div class="nums" style="grid-template-columns:repeat(5,1fr)">${[...Array(max)].map((_, i) => `<button data-i="${i + 1}">${i + 1}</button>`).join('')}</div><button class="big" id="ok" disabled>확정</button>`;
    let sel = null;
    u.stage.querySelectorAll('.nums button').forEach((b) => { b.onclick = () => { sel = Number(b.dataset.i); u.stage.querySelectorAll('.nums button').forEach((x) => x.classList.toggle('used', x !== b)); document.getElementById('ok').disabled = false; }; });
    document.getElementById('ok').onclick = () => { if (sel !== null) u.submit(sel); };
  },
  indian(u) {
    const q = u.q, others = S.players.filter((p) => p.pid !== S.me && q.cards[p.pid]);
    u.stage.innerHTML = u.qbox('내 카드만 안 보인다!', '카드 1~10 · 승부한 사람 중 가장 높은 카드가 승리') +
      `<div class="icards${u.cls}"><div class="ic me"><b>❓</b><span>나</span></div>${others.map((p) => `<div class="ic"><b>${q.cards[p.pid]}</b><span style="color:${p.color}">${esc(p.name)}</span></div>`).join('')}</div>
      <div class="small dim center" style="line-height:1.5">승부 승자 +30 + 패자 1명당 30 + 포기자 1명당 10<br>승부 패배 −30 · 포기 −10 (단, 최고 카드를 들고 포기하면 −30)</div>
      <div class="two"><button data-i="0">⚔️<br><span style="font-size:18px">승부</span></button><button data-i="1">🏳️<br><span style="font-size:18px">포기</span></button></div><button class="big" id="ok" disabled>확정</button>`;
    pickConfirm(u, '.two button');
  },
  goods(u) {
    const q = u.q;
    u.stage.innerHTML = u.qbox(`내 돈 <b style="color:var(--yel)">${q.C}코인</b>. 공동 금고에 얼마를 낼까?`, `금고의 돈은 ×${q.m} 불어나 참가자 모두에게 똑같이 나뉜다`) +
      `<div class="bignum" id="bn">0</div><input class="slider" id="sl" type="range" min="0" max="${q.C}" value="0">
      <div class="small dim center" id="hint"></div><button class="big" id="ok">이만큼 낸다</button>`;
    const n = Math.max(2, S.players.filter((p) => p.connected).length);
    const sl = document.getElementById('sl'), upd = () => { const x = Number(sl.value); document.getElementById('bn').textContent = x; document.getElementById('hint').textContent = `모두가 ${x}씩 내면 각자 ${(q.C - x + x * q.m).toFixed(1)}코인 · 나만 ${x} 내고 남은 안 내면 ${(q.C - x + (x * q.m) / n).toFixed(1)}코인`; };
    sl.oninput = upd; upd();
    document.getElementById('ok').onclick = () => u.submit(Number(sl.value));
  },
  auction(u) {
    const q = u.q, mine = q.hints[S.me];
    u.stage.innerHTML = u.qbox(`상품 가치 = 숨은 숫자 ${q.K}개의 합`, '숫자 하나는 1~30 · 최고가 1명이 낙찰 (동점이면 유찰)') +
      `<div class="card center"><div class="dim small">내가 아는 숫자</div><div class="bignum" style="font-size:56px">${mine == null ? '?' : mine}</div><div class="dim small">나머지 ${q.K - 1}개는 모른다 (평균 15.5)</div></div>
      <div class="small dim center">낙찰자 점수 = 가치 − 입찰가 (마이너스가 될 수도!) · 나머지 0점</div>` + u.numInput(`입찰가 (0~${q.max})`);
    u.bindInput((v) => { const n = Number(v); return Number.isInteger(n) && n >= 0 && n <= q.max ? n : (toast(`0~${q.max} 정수`), undefined); });
  },
  telepathy(u) {
    const q = u.q;
    u.stage.innerHTML = u.qbox(esc(q.text), '나와 같은 답을 고른 사람 1명당 +25 · 남들은 뭘 고를까?') +
      `<div class="opts" style="grid-template-columns:1fr 1fr">${q.options.map((o, i) => `<button class="opt tp" style="text-align:center;padding:22px 8px" data-i="${i}">${esc(o)}</button>`).join('')}</div><button class="big" id="ok" disabled>확정</button>`;
    pickConfirm(u, '.tp');
  },
  rps(u) {
    u.stage.innerHTML = u.qbox('단체 가위바위보!', '두 가지만 나오면 승부 · 한 가지나 세 가지 다 나오면 무승부') +
      `<div class="three">${['✊', '✌️', '🖐️'].map((x, i) => `<button data-i="${i}">${x}</button>`).join('')}</div><button class="big" id="ok" disabled>확정</button>`;
    pickConfirm(u, '.three button');
  },
};

/* 성냥개비 SVG */
function matchSVG(eq) {
  const W = 46, H = 78, stick = (x1, y1, x2, y2, on) => (on ? `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f2c27b" stroke-width="6" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="4.6" fill="#e5383b"/>` : `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b3166" stroke-width="3" stroke-dasharray="3 4" stroke-linecap="round"/>`);
  const SEGXY = [[9, 6, 35, 6], [38, 10, 38, 35], [38, 43, 38, 68], [9, 72, 35, 72], [6, 43, 6, 68], [6, 10, 6, 35], [9, 39, 35, 39]];
  let x = 0, out = '';
  for (const ch of eq) {
    out += `<g transform="translate(${x},0)">`;
    if (ch >= '0' && ch <= '9') { const m = SEG[+ch]; SEGXY.forEach((s, i) => { out += stick(...s, !!(m & (1 << i))); }); }
    else if (ch === '+' || ch === '-') { out += stick(8, 39, 36, 39, true); out += ch === '+' ? stick(22, 25, 22, 53, true) : ''; }
    else if (ch === '=') { out += stick(8, 31, 36, 31, true) + stick(8, 47, 36, 47, true); }
    out += '</g>'; x += W + 6;
  }
  return `<svg viewBox="-4 0 ${x} ${H}" style="width:100%;max-height:110px">${out}</svg>`;
}

// 시작
homeView();

})();
